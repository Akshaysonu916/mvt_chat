<!-- chat/templates/chat/user_list.html -->
<!DOCTYPE html>
<html>
<head>
    <title>User List</title>
</head>
<body>
    <h1>All Users</h1>
    <ul>
        {% for user in users %}
            {% if user != request.user %}
                <li>
                    {{ user.username }}
                    <a href="{% url 'chat' room_name=user.username %}">
                        <button>Chat</button>
                    </a>
                </li>
            {% endif %}
        {% endfor %}
    </ul>
</body>
</html>
