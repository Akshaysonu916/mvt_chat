{% extends 'base.html' %}

{% block content %}
<h2 class="text-2xl font-semibold mb-4">Login</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>

{% comment %} <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p> {% endcomment %}
{% endblock %}
